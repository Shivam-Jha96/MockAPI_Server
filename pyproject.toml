[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mockapi-server"
version = "1.0.0"
description = "Production-grade Mock API Server for SchedulerBot v4.4 (Meta Graph API v22.0, Inbound Webhooks, NLU, KMS)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Shivam Jha" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "cryptography>=43.0.0",
    "prometheus-client>=0.20.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
